# Paper-level run preset for kvcomp-codec benchmark (HayateQuant vs HALO vs TurboQuant).
#
# Reproduces the speed-quality comparison reported in the paper:
#   - Real-KV distortion (relMSE) on captured activations from 3 layers
#   - WikiText-2 perplexity under CompressedDynamicCache at bits {2,3,4}
#   - Encode overhead (ms/encode, Melem/s) at the model's true head dimension
#
# Usage:
#   python codec_benchmark.py --config-name paper_run \
#       model_path=/lustre/.../models/llama-3.1-8b-instruct
#
# Estimated wall-clock: ~20 min per model on a single GPU.

defaults:
  - benchmark_codec
  - _self_

model_path: ???
device: cuda:0

# Evaluate at all three bit-widths used in the paper
bits: [4, 3, 2]

# Real-KV capture: 2048 tokens covers the typical inference regime
capture_tokens: 2048

# Overhead timing: 50 iterations at S=1024, H=8 for stable mean
timing_heads: 8
timing_seq: 1024
timing_iters: 100            # more iterations for tighter timing estimate

# PPL: 32 WikiText-2 windows to match the longcontext benchmark resolution
run_ppl: true
ppl_max_length: 2048
ppl_stride: 1024
ppl_windows: 32
