# LEGACY: HALO paper preset, kept only to reproduce historical HALO results.
# New runs should use conf/paper_hayatequant.yaml (HayateQuant is the primary
# method; HALO is superseded and retained as a baseline).
#
# HALO paper: data-free rotated KV codec — speed-quality at iso-quality.
#
# Defines the headline experiment for the HALO paper:
#   * **Bits**: {4, 3, 2}.  3-bit is the iso-quality operating point most
#     KV-quant papers headline on (KIVI, TurboQuant Table 1, KVTuner Fig 4),
#     so it is the bit width readers expect to compare HALO at.
#   * **Codecs**: HALO-auto vs TurboQuant-paper (exact Beta + Gaussian-QR)
#     vs TurboQuant-hadamard (fast deployment approximation). All share a data-free
#     Lloyd-Max codebook so any quality difference is rotation only.
#   * **Models**: Llama-3.1-8B-Instruct (the TurboQuant paper headline model)
#     plus DeepSeek-R1-Distill-Qwen-7B and -1.5B for the reasoning regime.
#   * **Metrics**: distortion (relMSE on real-KV), WikiText-2 PPL under
#     CompressedDynamicCache, encode latency (ms/encode, Melem/s).
#
# Run (one model at a time):
#   srun --gres=gpu:1 .../python codec_benchmark.py --config-name paper_halo \
#       model_path=/lustre/.../models/llama-3.1-8b-instruct
#
# Estimated wall-clock: ~25 min/model on a single GPU.

defaults:
  - benchmark_codec
  - _self_

model_path: ???
device: cuda:0

# Headline grid: 4-bit (mild), 3-bit (sweet spot), 2-bit (aggressive).
bits: [4, 3, 2]

# Real-KV capture: 2048 tokens covers the typical inference regime.
capture_tokens: 2048

# Latency measurement: 100 iters at S=1024,H=8 for a tight mean.
timing_heads: 8
timing_seq: 1024
timing_iters: 100

# PPL: complete WikiText-2 raw test split (no window cap).
run_ppl: true
ppl_max_length: 2048
ppl_stride: 1024
ppl_windows: null

# Outlier layers: massive-activation layers (common in small Qwen R1-Distill models)
# destroy generation quality when quantized at any bit-width.  Detect them once and
# skip uniformly for ALL codecs so the comparison stays fair.  Set to false to
# reproduce the raw codec-only baseline (e.g. for distortion-only analysis on a model
# without outlier layers like Llama-3.1-8B-Instruct).
skip_outliers: true
outlier_ratio: 50.0
