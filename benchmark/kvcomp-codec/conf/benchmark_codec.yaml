# HayateQuant versus TurboQuant speed-quality benchmark (Hydra).
# Both model_path and output_dir are supplied by the caller.

model_path: ???
device: cuda:0
dtype: bfloat16

output_dir: ???

bits: [4, 3, 2]
methods: [turboquant, hayatequant]

capture_tokens: 2048        # real-KV capture length for distortion

# overhead measurement (synthetic tensor at the model's head dim)
timing_heads: 8
timing_seq: 1024
timing_iters: 50
sample_seed: 0

run_ppl: true
ppl_max_length: 2048
ppl_stride: 1024
# Smoke preset: this cap is emitted as ppl_complete_text_eval=false. The paper
# preset pins its separately labelled 32-window protocol.
ppl_windows: 8

hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
