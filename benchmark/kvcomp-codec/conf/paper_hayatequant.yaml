# HayateQuant paper: data-free block-VQ rotated KV codec — speed-quality grid.
#
# Defines the headline experiment for the HayateQuant paper:
#   * **Bits**: {4, 3, 2}.  3-bit is the iso-quality operating point most
#     KV-quant papers headline on (KIVI, TurboQuant Table 1, KVTuner Fig 4),
#     so it is the bit width readers expect to compare HayateQuant at.
#   * **Codecs**: the public HQ family is exactly ``HQ``, ``AdaptiveHQ``, and
#     ``RotationHQ``.  This primary preset runs HQ/AdaptiveHQ plus independent
#     ``TurboQuant-paper``/``FibQuant-paper`` quality baselines and the
#     rate-3-only ``BlockQuant-paper`` fixed-seed quality row. RotationHQ is
#     added only by its separately calibrated, complete rerun; it is never
#     silently substituted for HQ. HQ is the exact b=2 fixed split; AdaptiveHQ
#     keeps the same total pair budget and embeds its causal selector in an
#     existing value scale with zero added bits.
#   * **Models**: Llama-3.1-8B-Instruct (the TurboQuant paper headline model)
#     plus DeepSeek-R1-Distill-Qwen-7B and -1.5B for the reasoning regime.
#   * **Metrics**: distortion (relMSE on real-KV), WikiText-2 PPL under
#     CompressedDynamicCache, encode latency (ms/encode, Melem/s).
#
# Run (one model at a time):
#   srun --gres=gpu:1 .../python codec_benchmark.py --config-name paper_hayatequant \
#       model_path=/lustre/.../models/llama-3.1-8b-instruct
#
# Estimated wall-clock: ~30 min/model on a single GPU.

defaults:
  - benchmark_codec
  - _self_

model_path: ???
device: cuda:0

# Canonical paper contract: every layer and every token uses the named codec.
# Keeping an FP16 sink or model-dependent skipped layers changes both the
# algorithm and the effective bit rate, especially on short zero-shot prompts.
# Formal TQ/HQ also use token-local scales and disable dynamic outlier/online
# allocation, so teacher-forced PPL and likelihood safely use one causal-mask
# forward; temporally coupled exploratory codecs automatically use incremental
# target scoring instead.
sink_tokens: 0
recent_tokens: 0

# Headline grid: 4-bit (mild), 3-bit (sweet spot), 2-bit (aggressive).
bits: [4, 3, 2]

# Optional method filter. Empty means run the full codec registry; paper
# This default is itself formal and contains no proxy/development labels.
methods: [TurboQuant-paper, FibQuant-paper, BlockQuant-paper, HQ, AdaptiveHQ]

# Real-KV capture: 2048 tokens covers the typical inference regime.
capture_tokens: 2048

# Latency measurement: 100 iters at S=1024,H=8 for a tight mean.
timing_heads: 8
timing_seq: 1024
timing_iters: 100

# PPL: complete WikiText-2 raw test split (no window cap).
run_ppl: true
ppl_max_length: 2048
ppl_stride: 1024
ppl_windows: null

# Paper runs are genuinely data-free and quantize all layers.  Outlier-layer
# skipping remains available in exploratory configs, but it is model/prompt
# dependent and must not silently enter a fixed-rate headline result.
skip_outliers: false
outlier_ratio: 50.0
