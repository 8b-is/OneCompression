# GPU verification: which TaperKV floor preserves the needle, at what memory.
# Needle + RULER + PPL only (fast), on Llama-3.1-8B-Instruct (no thinking).
# Sweeps key/value floor candidates so we can pick the retrieval-safe operating
# point empirically instead of guessing. This is the evidence behind the
# b_min>=3 floor fix shipped in conf/paper_taperkv.yaml + conf/turboquant_paper.yaml.
#
# Run from benchmark/kvcomp-longcontext (so the searchpath below finds the base
# config in ./conf):
#   srun --gres=gpu:1 .venv/bin/python -u kv_benchmark.py \
#       --config-dir paper/tests/conf --config-name test_taper_floors \
#       model_path=/lustre/.../models/llama-3.1-8b-instruct
defaults:
  - benchmark_longcontext
  - _self_

# Resolve the base `benchmark_longcontext` config from the main conf/ dir even
# though this file lives under paper/tests/conf (run from kvcomp-longcontext).
hydra:
  searchpath:
    - file://${hydra:runtime.cwd}/conf

model_path: ???
output_dir: ${hydra:runtime.cwd}/results_test_floors

# Match the paper_taperkv long-context grid so memory fractions are comparable.
target_mem: 0.20
sink_tokens: 4
recent_tokens: 128
requant_stride: 16

# Only the floor sweep + FullKV reference + the two affine bounds that calibrate
# the "floor must be >=3" claim (Uniform-INT3 ok, INT2 dies).
methods:
  - FullKV
  - Uniform-INT3
  - Uniform-INT2
  - TK-cur-8422          # current headline floor (key 2) -- control, expect low needle
  - TK-f3v2-8432         # key floor 3
  - TK-f4v2-8442         # key floor 4 (base-config design)
  - TK-3bit-4332         # iso-3-bit, key floor 3
  - TK-3bit-4333         # 3.25-bit, all floor 3 (safe)

uniform_bits: [3, 2]
kivi_bits: []
halo_variants: []
turboquant_variants: []
codec_variants: []
turbotaper_sweep: []

# TaperKV floor candidates (the thing under test).
taperkv:
  key_bits: 8
  value_bits: 4
  b_min: 4
  b_min_value: 2
taperkv_sweep:
  - {label: TK-cur-8422,  key_bits: 8, value_bits: 4, b_min: 2, b_min_value: 2, recent_tokens: 128}
  - {label: TK-f3v2-8432, key_bits: 8, value_bits: 4, b_min: 3, b_min_value: 2, recent_tokens: 128}
  - {label: TK-f4v2-8442, key_bits: 8, value_bits: 4, b_min: 4, b_min_value: 2, recent_tokens: 128}
  - {label: TK-3bit-4332, key_bits: 4, value_bits: 3, b_min: 3, b_min_value: 2, recent_tokens: 128}
  - {label: TK-3bit-4333, key_bits: 4, value_bits: 3, b_min: 3, b_min_value: 3, recent_tokens: 128}

# Retrieval is the headline metric we are testing.
run_needle: true
context_lens: [4096, 8192, 16384]
depths: [0.1, 0.25, 0.5, 0.75, 0.9]
seeds: 3
max_new_needle: 32          # Llama is not a thinking model, 32 is enough

run_ruler: true
ruler_keys: 4
ruler_seeds: 5

run_ppl: true
ppl_max_length: 4096
ppl_stride: 2048
ppl_windows: 8

# Skip the slow reasoning evals for this calibration run.
run_gsm8k: false
run_math: false
run_longbench: false
run_livecodebench: false

# Llama is an instruct model; eager not needed (no ThinKV here) but keep default.
attn_implementation: sdpa
thinkv:
  auto_configure: false

skip_outliers: true
outlier_ratio: 50.0
