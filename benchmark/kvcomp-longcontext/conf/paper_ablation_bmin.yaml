# paper_ablation_bmin.yaml
# ============================================================
# Ablation: sensitivity of TaperKV to the key-floor (b_min).
#
# Sweeps:
#   (A) 3-bit slot (key_bits=4 / value_bits=3):
#       b_min = 2, 3, 4, 5  — how strict is the floor constraint?
#   (B) 4-bit slot (key_bits=6 / value_bits=3):
#       b_min = 2, 4, 6     — does a higher ceiling amplify the floor sensitivity?
#   (C) Reference codecs at 3-bit (TurboQuant-3bit, HayateQuant-3bit):
#       iso-memory, no age schedule, to show uniform allocation is suboptimal.
#
# Run:
#   python kv_benchmark.py --config-name paper_ablation_bmin \
#       model_path=/lustre/.../llama-3.1-8b-instruct
# ============================================================

defaults:
  - paper_taperkv
  - _self_

output_dir: ${hydra:runtime.cwd}/results_ablation/bmin

methods:
  - FullKV
  # --- 3-bit b_min sweep ---
  - TaperKV-3bit-bmin2
  - TaperKV-3bit-bmin3
  - TaperKV-3bit-bmin4
  - TaperKV-3bit-bmin5
  # --- 4-bit b_min sweep ---
  - TaperKV-4bit-bmin2
  - TaperKV-4bit-bmin4
  - TaperKV-4bit-bmin6
  # --- Reference codecs (iso-memory, no age schedule) ---
  - TurboQuant-3bit
  - HayateQuant-3bit
  - KIVI-INT2

taperkv_sweep:
  - {label: "TaperKV-3bit-bmin2", key_bits: 4, value_bits: 3, b_min: 2, b_min_value: 2}
  - {label: "TaperKV-3bit-bmin3", key_bits: 4, value_bits: 3, b_min: 3, b_min_value: 2}
  - {label: "TaperKV-3bit-bmin4", key_bits: 4, value_bits: 3, b_min: 4, b_min_value: 2}
  - {label: "TaperKV-3bit-bmin5", key_bits: 4, value_bits: 3, b_min: 5, b_min_value: 2}
  - {label: "TaperKV-4bit-bmin2", key_bits: 6, value_bits: 3, b_min: 2, b_min_value: 2}
  - {label: "TaperKV-4bit-bmin4", key_bits: 6, value_bits: 3, b_min: 4, b_min_value: 2}
  - {label: "TaperKV-4bit-bmin6", key_bits: 6, value_bits: 3, b_min: 6, b_min_value: 2}

# Disable heavy benchmarks for ablation (needle + PPL sufficient)
run_gsm8k: false
run_math: false
run_ruler: false
run_longbench: false
run_needle: true
context_lens: [4096, 8192, 16384]
depths: [0.1, 0.5, 0.9]
seeds: 3
max_new_needle: 256
run_ppl: true
ppl_max_length: 4096
ppl_stride: 2048
ppl_windows: null            # complete WikiText-2 test split
