# LEGACY COMBINED DIAGNOSTIC -- NOT THE P-FORMAL PAPER GRID.
# This preset retains the historical 32K LongBench and 4096/2048 PPL settings
# for local development only.  Current paper runs must use
# benchmark/kvcomp-codec/submit_hayatequant_paper.sh, whose fail-closed shards
# fix the full protocol and provenance.  The rows below are still restricted
# to the public HQ/AdaptiveHQ proposals and independent exact-search quality
# baselines; BlockQuant remains descriptive and is excluded from speed claims.

defaults:
  - benchmark_longcontext
  - _self_

model_path: ???  # supply an external local path or Hugging Face id
attn_implementation: sdpa
output_dir: ${hydra:runtime.cwd}/results_paper1/hayatequant_fib_blockquant

thinkv:
  auto_configure: false

methods:
  - FullKV
  - TurboQuant-paper
  - FibQuant-paper
  - BlockQuant-paper
  - HQ
  - HQ-Frontier
  - AdaptiveHQ
  - RotationHQ

turboquant_variants:
  - {label: TurboQuant-paper, bits: 3, dist: beta, rotation_mode: dense}

fibquant_variants:
  - {label: FibQuant-paper, bits: 3}

blockquant_variants:
  - {label: BlockQuant-paper, bits: 3}

hayatequant_variants:
  - {label: HQ, bits: 3}
  - {label: HQ-Frontier, bits: 3}
  - {label: AdaptiveHQ, bits: 3}
  - {label: RotationHQ, bits: 3}

uniform_bits: []
kivi_bits: []
halo_variants: []
codec_variants: []

run_needle: true
context_lens: [4096, 8192, 16384]
depths: [0.1, 0.25, 0.5, 0.75, 0.9]
seeds: 3
max_new_needle: 32

run_ruler: false            # local multi-key diagnostic is not a RULER benchmark
ruler_keys: 4
ruler_seeds: 5

# NeMo-Skills RULER-v1 100-sample/task protocol. Disabled in the combined default because the
# 13 x 100 tokenizer-specific examples are submitted as dedicated long jobs.
# A task subset/finite limit is always labelled an incomplete protocol smoke run.
# The `official_ruler_*` names are retained for config compatibility only.
run_official_ruler_v1: false
official_ruler_data_root: ${oc.env:KVCOMP_RULER_DATA_ROOT,???}
official_ruler_manifest_path: null
official_ruler_tasks: []
official_ruler_max_context: 8192
official_ruler_start: 0
official_ruler_limit: null

run_longbench: true
longbench_tasks: []
longbench_max_length: 32768
longbench_limit: null       # complete official split

# Official LongCodeBench/LongCodeQA. Disabled in the combined default because
# each length bracket is submitted as its own recoverable paper job. The runner
# refuses silent prompt truncation when a bracket exceeds the model context.
run_longcodeqa: false
longcodeqa_data_root: ${oc.env:KVCOMP_LONGCODEQA_ROOT,???}
longcodeqa_revision: 989d5eff750d65a72c522e47f8f745ef2e22906b
longcodeqa_brackets: [32K]
longcodeqa_max_context: null
longcodeqa_max_new: 16
longcodeqa_start: 0
longcodeqa_limit: null

run_gsm8k: false
run_math: false
math_grader: math_verify
math_verify_version: "0.9.0"

run_ppl: true
ppl_max_length: 4096
ppl_stride: 2048
ppl_windows: null           # complete WikiText-2 test split
