# TaperKV paper: retrieval-preserving age-graded KV quantization.
#
# Thesis under test: at an aggressive memory operating point (~3-bit average), eviction
# baselines (StreamingLLM, ThinKV) structurally fail long-context retrieval
# because the needle in the dropped region is unrecoverable.  Quantization
# baselines (Uniform-INT, KIVI, TurboQuant) avoid eviction but spend bits
# uniformly across token age.  TaperKV keeps every token at a non-zero
# precision floor with a higher precision sink + recent window, so the needle
# always survives — lossily but recoverably — and the bit budget is spent
# where retrieval needs it.  This preset evaluates that thesis.
#
# Methods (shared prompt grid; realised memory is recorded per method):
#   * FullKV                    — fp16 upper bound
#   * Uniform-INT3              — per-token uniform affine (lower bound at 3-bit)
#   * KIVI-INT2                 — per-channel-key/per-token-value (KIVI paper)
#   * StreamingLLM              — eviction baseline at its explicit target_mem point
#   * ThinKV                    — HF TBQ-only diagnostic (TBE is not implemented)
#   * PM-KVQ                    — progressive precision baseline (no evict)
#   * TurboQuant-3bit           — uniform rotated Lloyd-Max
#   * HALO-3bit                 — proposed companion codec at iso-bit
#   * TaperKV (~4-bit)          — proposed at the standard operating point
#   * TaperKV-3bit (~3-bit)     — proposed candidate operating point
#   * TurboTaper-3bit           — TaperKV schedule x rotated Lloyd-Max codec
#
# Run:
#   srun --gres=gpu:1 .../python kv_benchmark.py --config-name paper_taperkv \
#       model_path=/lustre/.../models/DeepSeek-R1-Distill-Qwen-7B

defaults:
  - benchmark_longcontext
  - _self_

model_path: ???

output_dir: ${hydra:runtime.cwd}/results_paper2/taperkv

# StreamingLLM stored/fp16 operating point. Do not infer equality with a
# quantizer from this setting; use the Needle v2 realised-memory ledger.
target_mem: 0.20
sink_tokens: 4
recent_tokens: 128
requant_stride: 16

methods:
  - FullKV
  - Uniform-INT3
  - KIVI-INT2
  - StreamingLLM
  - ThinKV                  # TBQ-only; output is marked paper_comparable=false
  - PM-KVQ
  - TurboQuant-3bit
  - HayateQuant-3bit        # PROPOSED companion codec (supersedes HALO)
  - HALO-NCIT-3bit          # strongest prior baseline
  - TaperKV
  - TaperKV-3bit
  - TurboTaper-3bit

uniform_bits: [3]            # generates Uniform-INT3
kivi_bits: [2]

# TaperKV at the standard operating point (~4.5-bit avg). KEY floor = 4: keys are
# quantized per-token, and per-token <=2-bit keys are catastrophic for retrieval
# (Uniform-INT2 -> needle 0.0; KIVI-INT2 survives only because it uses per-channel
# keys). A 2-bit key floor was making the needle die in the middle/old region even
# at this 4-bit point. Empirically verified on Llama-3.1-8B (tests/conf/
# test_taper_floors.yaml, job 45990): floor 2 -> needle 0.64 / PPL 9.58, whereas
# floor 4 -> needle 1.00 / PPL 6.14. Value floor stays 2 (per-token 2-bit values
# are tolerable, as KIVI shows), matching the base-config + PM-KVQ key_final_bits=4
# design. This is the retrieval-preserving operating point the paper claims.
taperkv:
  key_bits: 8
  value_bits: 4
  b_min: 4                  # key floor 4: needle survives (verified needle=1.0)
  b_min_value: 2            # value floor 2: per-token 2-bit values are tolerable

# Candidate ~3-bit point (K=4/V=3, key floor 3, value floor 2). Earlier
# needle/local-multikey numbers are legacy v1 outputs and must be replaced by
# Needle v2 before any matched-memory or quality claim. `recent_tokens` inherits 128.
taperkv_sweep:
  - {label: "TaperKV-3bit", key_bits: 4, value_bits: 3, b_min: 3, b_min_value: 2}

# TurboTaper at standard ~4-bit (left at defaults; not in `methods` for this preset).
turbotaper:
  dist: gaussian
  rotation_mode: hadamard
  n_outlier_floor: 32

# Companion rotated-codec variant of TaperKV at the 3-bit headline budget.
# Align b_min=3, b_min_value=3, and inherit recent_tokens=128 from the config
# default.  This is a candidate matched schedule only: a paper comparison must
# verify the per-trial cache ledger and declared memory tolerance before calling
# it matched-memory.
#
# TWO bugs were fixed in TurboTaper (2026-06-04):
#
# Bug-1 (b_min_value=2, fixed 2026-06-03): Hadamard + 2-bit value floor is
# catastrophic on Qwen-based models (R1-Qwen-14B: GSM8K 16%; QwQ-32B: GSM8K 0%)
# despite normal PPL.  3-bit floor (TurboQuant-3bit: 88%) confirms safety.
# Fix: b_min_value=3.
#
# Bug-2 (cascade re-quantisation, fixed 2026-06-04): turbotaper_cache.py
# re-quantised floor tokens every 16 steps.  The rotated Lloyd-Max codec is not
# perfectly idempotent, so drift accumulates over many passes (R1-7B math500=24%
# despite gsm8k=69%=FullKV; QwQ-32B gsm8k=17% even after Bug-1 fix).
# Fix (delta quantisation): only re-quantise tokens that changed bit-width.
# See turbotaper_cache.py class docstring for details.
turbotaper_sweep:
  - {label: "TurboTaper-3bit", key_bits: 4, value_bits: 3, b_min: 3, b_min_value: 3}

# Single TurboQuant Algorithm-1-MSE component baseline at 3-bit (finite-Beta +
# Gaussian-QR); this label does not claim a mixed-precision Table-1 reproduction.
turboquant_variants:
  - {label: "TurboQuant-3bit", bits: 3, dist: beta, rotation_mode: dense}

# HayateQuant at 3-bit (PROPOSED companion codec at iso-bit to TurboQuant-3bit),
# with the strongest prior HALO operating point as baseline (iso-storage).
hayatequant_variants:
  - {label: "HayateQuant-3bit", bits: 3}
halo_variants:
  - {label: "HALO-NCIT-3bit", bits: 3, key_scale_mode: nc, value_scale_mode: ls_iter}

# ThinKV TBQ: keep eager attention so its sparsity calibration runs. The HF
# cache does not reproduce TBE eviction and is not a paper-comparable ThinKV row.
attn_implementation: eager
thinkv:
  group_size: 16
  precision: {R: 4, E: 4, T: 2}     # TBQ precision preset
  auto_configure: true
  calib_max_new: 200
  capture_long: false                # cheaper, GSM8K only

# --- Long-context retrieval (the headline metric for the TaperKV paper) ---
run_needle: true
context_lens: [4096, 8192, 16384]
depths: [0.1, 0.25, 0.5, 0.75, 0.9]
seeds: 3
max_new_needle: 256     # R1-Distill models always emit <think> prefix; 32 is too short

run_ruler: false            # local multi-key diagnostic is not a RULER benchmark
ruler_keys: 4
ruler_seeds: 5

run_longbench: true
longbench_tasks: []
longbench_max_length: 32768
longbench_limit: null       # complete official split

# --- Reasoning non-degradation (TaperKV thesis: keeps reasoning intact) ---
run_gsm8k: true
gsm8k_limit: null           # complete 1,319-example test split
max_new_reason: 4096
run_math: true
math_limit: null            # complete MATH-500 test split
max_new_math: 4096
math_grader: math_verify    # required; no silent local fallback
math_verify_version: "0.9.0"

# --- WikiText-2 PPL sanity ---
run_ppl: true
ppl_max_length: 4096
ppl_stride: 2048
ppl_windows: null           # complete WikiText-2 test split

skip_outliers: true
outlier_ratio: 50.0
