# Paper-faithful TurboQuant benchmark (arXiv:2504.19874, Zandieh et al., Google).
#
# Setup faithful to the TurboQuant paper:
#   * Model      : Llama-3.1-8B-Instruct (paper's 1st KV-cache model). The 2nd
#                  paper model, Ministral-8B-Instruct-2410, runs the same grid via
#                  conf/turboquant_paper_ministral.yaml.
#   * Bit-widths : pure 2/3/4-bit + outlier-split 2.5-bit (32ch@3 + 96ch@2) and
#                  3.5-bit (32ch@4 + 96ch@3) for head_dim=128 (paper §4.3).
#   * Metrics    : Needle-in-a-Haystack recall (paper §4.2), LongBench-E
#                  end-to-end generation (paper §4.3, Table 1), WikiText-2 PPL.
#   * Baselines  : KIVI (per-channel key 2-bit), StreamingLLM (eviction),
#                  Uniform-INT (scalar quant) — the closest analogues to the
#                  paper's KIVI / SnapKV / PyramidKV / PolarQuant comparison.
#
# Run (GPU node):
#   srun --gres=gpu:1 .../python -u kv_benchmark.py --config-name turboquant_paper

defaults:
  - benchmark_longcontext
  - _self_

model_path: /lustre/home/frj/yuma-ichikawa/conference/models/llama-3.1-8b-instruct
attn_implementation: sdpa   # codec/eviction methods need no attention capture

output_dir: ${hydra:runtime.cwd}/results_turboquant

# ThinKV is not in this comparison; skip its eager-attention sparsity calibration
# (it would fail under sdpa and is unused here).
thinkv:
  auto_configure: false

methods:
  - FullKV
  - Uniform-INT4
  - Uniform-INT3
  - Uniform-INT2
  - KIVI-INT2
  - StreamingLLM
  - TurboQuant-4bit
  - TurboQuant-3.5bit
  - TurboQuant-3bit
  - TurboQuant-2.5bit
  - TurboQuant-2bit
  - HALO-4bit
  - HALO-3bit          # 3-bit HALO (proposed codec, iso-quality to TurboQuant-3bit)
  - HALO-2bit
  # Enhanced HALO (role-asymmetric scale): norm-correct keys (faithful attention
  # logit) + least-squares values (MSE-optimal).  Storage-identical to plain HALO.
  - HALO-NC-4bit
  - HALO-NC-3bit
  - HALO-NC-2bit
  # Enhanced HALO + ls_iter values (one Lloyd alternating-min step on values).
  - HALO-NCIT-4bit
  - HALO-NCIT-3bit
  - HALO-NCIT-2bit
  - HALO-dense-LS-4bit   # dense rotation + LS scale: best PPL at every bit (ablation)
  - HALO-dense-LS-3bit
  - HALO-dense-LS-2bit
  - FP8
  - NVFP4
  - TaperKV            # K=8/V=4, key floor 4 / value floor 2 (~4.5-bit, retrieval-safe)
  - TaperKV-3bit       # K=4/V=3, key floor 3 / value floor 2 (~3-bit iso-memory to HALO-3bit)
  - TurboTaper

uniform_bits: [4, 3, 2]
kivi_bits: [2]

# HALO at iso bit-width to TurboQuant (same rotated Lloyd-Max core, faster auto rotation).
# Codebook note: TurboQuant uses `dist: beta` (the paper-shipped default for RoPE keys)
# while HALO defaults to `dist: gaussian` + least-squares scale.  This IS the correct
# paper-vs-paper comparison: each codec at its best settings.  The codec-speed table and
# codec_benchmark.py distortion results confirm HALO is no worse than TurboQuant at each
# bit-width despite using gaussian rather than beta (the rotation + LS scale compensates).
halo_variants:
  - {label: "HALO-4bit", bits: 4}
  - {label: "HALO-3bit", bits: 3}
  - {label: "HALO-2bit", bits: 2}
  # Enhanced HALO (proposed): per-role scale -- norm-correcting (nc) keys preserve
  # the rotated norm so the attention logit is shrunk only by cos(theta) (vs
  # cos^2 for plain LS), least-squares (ls) values are MSE-optimal.  Iso-storage.
  - {label: "HALO-NC-4bit", bits: 4, key_scale_mode: nc, value_scale_mode: ls}
  - {label: "HALO-NC-3bit", bits: 3, key_scale_mode: nc, value_scale_mode: ls}
  - {label: "HALO-NC-2bit", bits: 2, key_scale_mode: nc, value_scale_mode: ls}
  # Enhanced HALO + ls_iter on values: one Lloyd alternating-minimisation step
  # (re-quantise at the fitted scale, re-fit) -> monotone-lower value MSE, free.
  - {label: "HALO-NCIT-4bit", bits: 4, key_scale_mode: nc, value_scale_mode: ls_iter}
  - {label: "HALO-NCIT-3bit", bits: 3, key_scale_mode: nc, value_scale_mode: ls_iter}
  - {label: "HALO-NCIT-2bit", bits: 2, key_scale_mode: nc, value_scale_mode: ls_iter}
  # Dense rotation + LS scale: same GEMM cost as folded-Hadamard at head_dim=128,
  # marginally better Gaussianisation -> best PPL at every bit on Ministral/Llama.
  # Included as a Pareto ablation alongside the default HALO (Hadamard-GEMM + LS).
  - {label: "HALO-dense-LS-4bit", bits: 4, rotation_mode: dense, ls_scale: true}
  - {label: "HALO-dense-LS-3bit", bits: 3, rotation_mode: dense, ls_scale: true}
  - {label: "HALO-dense-LS-2bit", bits: 2, rotation_mode: dense, ls_scale: true}

# Additional standalone-codec baselines (now reachable via the generic path):
# FP8 (the recommended 2026 native baseline) and NVFP4 (4-bit E2M1 float).
codec_variants:
  - {label: "FP8", codec: fp8}
  - {label: "NVFP4", codec: nvfp4}

# TaperKV baseline (recipe paper's method, shown here as a HALO-paper baseline).
# KEY floor = 4: per-token <=2-bit keys are catastrophic for retrieval (verified
# on Llama, job 45990: key floor 2 -> needle 0.64; key floor 4 -> needle 1.00).
# A 2-bit key floor would be an unfair strawman here, so the baseline uses its
# proper retrieval-safe floor. The TaperKV-3bit sweep point (key floor 3, value
# floor 2) sits at mem_fraction 0.197 -- iso-memory to HALO-3bit / Uniform-INT3.
taperkv:
  key_bits: 8
  value_bits: 4
  b_min: 4
  b_min_value: 2
taperkv_sweep:
  - {label: "TaperKV-3bit", key_bits: 4, value_bits: 3, b_min: 3, b_min_value: 2}

turbotaper:
  dist: gaussian
  rotation_mode: hadamard
  n_outlier_floor: 32     # protect 32 highest-energy channels at the 2-bit floor

# Beta codebook (exact Beta((d-1)/2) law) + per-vector L2 norm is the faithful
# TurboQuant; gaussian (RMS) is the high-d limit. head_dim=128 is power-of-two so
# the fast Hadamard rotation applies for full-width variants.
turboquant_variants:
  - {label: "TurboQuant-4bit",   bits: 4, dist: beta}
  - {label: "TurboQuant-3.5bit", bits: 3, n_outlier: 32, outlier_bits: 4, dist: beta}
  - {label: "TurboQuant-3bit",   bits: 3, dist: beta}
  - {label: "TurboQuant-2.5bit", bits: 2, n_outlier: 32, outlier_bits: 3, dist: beta}
  - {label: "TurboQuant-2bit",   bits: 2, dist: beta}

# --- Needle-in-a-Haystack (paper §4.2: vary context, recall, 4x+ compression) ---
run_needle: true
context_lens: [4096, 8192, 16384]
depths: [0.1, 0.25, 0.5, 0.75, 0.9]
seeds: 3
max_new_needle: 32

# --- LongBench-E (paper §4.3 / Table 1: the headline downstream metric) ---
run_longbench: true
longbench_tasks: []         # all 13 English LongBench-E tasks
longbench_max_length: 7500
longbench_limit: 10         # 10 x 13 tasks x 14 methods fits the time budget

# TurboQuant is a long-context quantizer, not a reasoning method: GSM8K/MATH off.
run_gsm8k: false
run_math: false
run_ruler: true             # extra retrieval stress (disambiguation)
ruler_keys: 4
ruler_seeds: 5

# --- perplexity sanity ---
run_ppl: true
ppl_max_length: 4096
ppl_stride: 2048
ppl_windows: 16
