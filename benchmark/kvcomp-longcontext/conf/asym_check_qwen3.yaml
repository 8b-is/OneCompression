# Downstream check for the K/V-asymmetric bit allocation (K4V2 = same 3.0
# avg bits/coord as uniform 3-bit): PPL says K4V2 wins (-0.087 Llama /
# -0.152 Qwen3-8B, bench_kvasym_v8.py); verify it also holds on retrieval
# (Needle / RULER) where VALUE fidelity matters more than in PPL.
#   srun --gres=gpu:1 python -u kv_benchmark.py --config-name asym_check_qwen3
defaults:
  - benchmark_longcontext
  - _self_

model_path: /lustre/home/frj/yuma-ichikawa/conference/models/Qwen3-8B
attn_implementation: sdpa
output_dir: ${hydra:runtime.cwd}/results_paper1/hayatequant_asym

thinkv:
  auto_configure: false

methods:
  - FullKV
  - HayateQuant-3bit
  - HayateQuant-K4V2

hayatequant_variants:
  - {label: "HayateQuant-3bit", bits: 3}
  - {label: "HayateQuant-K4V2", bits: 4, value_bits: 2}

run_needle: true
context_lens: [4096, 8192, 16384]
depths: [0.1, 0.25, 0.5, 0.75, 0.9]
seeds: 3
max_new_needle: 32

run_longbench: false
run_gsm8k: false
run_math: false
run_ruler: true
ruler_keys: 4
ruler_seeds: 5

run_ppl: true
ppl_max_length: 4096
ppl_stride: 2048
ppl_windows: 16
