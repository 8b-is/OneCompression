# Focused downstream check for the optional SpinQuant-style calibration:
# does the calibrated codec hold up on legacy retrieval metrics (Needle / local multi-key),
# not just PPL, vs the data-free default at the 2-bit headline point?
#   srun --gres=gpu:1 python -u kv_benchmark.py --config-name calib_check_llama
defaults:
  - benchmark_longcontext
  - _self_

model_path: /lustre/home/frj/yuma-ichikawa/conference/models/llama-3.1-8b-instruct
attn_implementation: sdpa
output_dir: ${hydra:runtime.cwd}/results_paper1/hayatequant_calib

thinkv:
  auto_configure: false

methods:
  - FullKV
  - HayateQuant-2bit
  - HayateQuant-calib-2bit

hayatequant_variants:
  - {label: "HayateQuant-2bit", bits: 2}
  - {label: "HayateQuant-calib-2bit", bits: 2,
     calibration: /lustre/home/frj/yuma-ichikawa/conference/ichikawa_works/kvcomp_hayatequant/results/calib_llama-3.1-8b-instruct_2bit.pt}

run_needle: true
context_lens: [4096, 8192, 16384]
depths: [0.1, 0.25, 0.5, 0.75, 0.9]
seeds: 3
max_new_needle: 32

run_longbench: false
run_gsm8k: false
run_math: false
run_ruler: true
ruler_keys: 4
ruler_seeds: 5

run_ppl: true
ppl_max_length: 4096
ppl_stride: 2048
ppl_windows: 16
