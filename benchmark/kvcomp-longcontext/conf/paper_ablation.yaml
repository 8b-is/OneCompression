# Paper ablation study for the proposed codecs/recipes (HALO + TaperKV).
#
# Complements two other artefacts:
#   * codec_speed.py  -- the codec-level SPEED x QUALITY (MSE / attn-error) Pareto
#                        ablation of HALO's levers (GEMM rotation, LS scale,
#                        Hadamard-vs-dense). Run that for the throughput axis.
#   * this config     -- the END-TASK (PPL + needle retrieval) ablation: does each
#                        HALO lever / TaperKV design choice carry through to the
#                        downstream metric on a real model?
#
# HALO lever ablation (all at iso bit-width & iso storage):
#   HALO-h-noLS    rotation=hadamard,      ls_scale=off  == Gaussian TurboQuant component control
#   HALO-hg-noLS   rotation=hadamard_gemm, ls_scale=off  (speed lever; quality == h-noLS)
#   HALO-hg-LS     rotation=hadamard_gemm, ls_scale=on   (full HALO default)
#   HALO-dense-LS  rotation=dense,         ls_scale=on   (rotation ablation; expect regress)
# Reference: TurboQuant-{bits} (beta, the shipped faithful default).
#
# TaperKV design ablation (age-graded precision, K>=V asymmetry):
#   TaperKV-asym   K=6/V=3   (Key bits > Value bits -- the proposed asymmetry)
#   TaperKV-sym    K=4/V=4   (no asymmetry, ~matched average bits)
#   TaperKV-revsym K=3/V=6   (reversed: V>K -- expect worse; keys are more sensitive)
#
# Run (GPU node):
#   srun --gres=gpu:1 .../python -u kv_benchmark.py --config-name paper_ablation \
#       model_path=/lustre/.../models/llama-3.1-8b-instruct

defaults:
  - benchmark_longcontext
  - _self_

model_path: ???  # supply an external local path or Hugging Face id
attn_implementation: sdpa

output_dir: ${hydra:runtime.cwd}/results_ablation/halo

# ThinKV is not part of this ablation; skip its eager-attention calibration.
thinkv:
  auto_configure: false

methods:
  - FullKV
  # --- HALO lever ablation @ 3-bit ---
  - HALO-h-noLS-3
  - HALO-hg-noLS-3
  - HALO-hg-LS-3
  - HALO-hg-NC-3       # + norm-correct keys (proposed scale lever 1)
  - HALO-hg-NCIT-3     # + ls_iter values (lever 1 + lever 2)
  - HALO-dense-LS-3
  - TurboQuant-3bit
  # --- HALO lever ablation @ 4-bit ---
  - HALO-h-noLS-4
  - HALO-hg-noLS-4
  - HALO-hg-LS-4
  - HALO-hg-NC-4
  - HALO-hg-NCIT-4
  - HALO-dense-LS-4
  - TurboQuant-4bit
  # --- TaperKV design ablation ---
  - TaperKV-asym
  - TaperKV-sym
  - TaperKV-revsym

uniform_bits: []          # no uniform baselines in the ablation
kivi_bits: []

# HALO levers: rotation_mode x scale_mode at fixed bits (iso storage).
# All variants use explicit key_scale_mode / value_scale_mode so their
# behaviour is stable regardless of the class default for those fields.
halo_variants:
  - {label: "HALO-h-noLS-3",   bits: 3, rotation_mode: hadamard,      key_scale_mode: rms, value_scale_mode: rms}
  - {label: "HALO-hg-noLS-3",  bits: 3, rotation_mode: hadamard_gemm, key_scale_mode: rms, value_scale_mode: rms}
  - {label: "HALO-hg-LS-3",    bits: 3, rotation_mode: hadamard_gemm, key_scale_mode: ls,  value_scale_mode: ls}
  - {label: "HALO-hg-NC-3",    bits: 3, rotation_mode: hadamard_gemm, key_scale_mode: nc,  value_scale_mode: ls}
  - {label: "HALO-hg-NCIT-3",  bits: 3, rotation_mode: hadamard_gemm, key_scale_mode: nc,  value_scale_mode: ls_iter}
  - {label: "HALO-dense-LS-3", bits: 3, rotation_mode: dense,         key_scale_mode: ls,  value_scale_mode: ls}
  - {label: "HALO-h-noLS-4",   bits: 4, rotation_mode: hadamard,      key_scale_mode: rms, value_scale_mode: rms}
  - {label: "HALO-hg-noLS-4",  bits: 4, rotation_mode: hadamard_gemm, key_scale_mode: rms, value_scale_mode: rms}
  - {label: "HALO-hg-LS-4",    bits: 4, rotation_mode: hadamard_gemm, key_scale_mode: ls,  value_scale_mode: ls}
  - {label: "HALO-hg-NC-4",    bits: 4, rotation_mode: hadamard_gemm, key_scale_mode: nc,  value_scale_mode: ls}
  - {label: "HALO-hg-NCIT-4",  bits: 4, rotation_mode: hadamard_gemm, key_scale_mode: nc,  value_scale_mode: ls_iter}
  - {label: "HALO-dense-LS-4", bits: 4, rotation_mode: dense,         key_scale_mode: ls,  value_scale_mode: ls}

# TurboQuant Algorithm-1-MSE component references (finite-Beta codebook) at
# the same bit-widths; these do not claim a Table-1 mixed-precision reproduction.
turboquant_variants:
  - {label: "TurboQuant-3bit", bits: 3, dist: beta, rotation_mode: dense}
  - {label: "TurboQuant-4bit", bits: 4, dist: beta, rotation_mode: dense}

# TaperKV K>=V asymmetry ablation (age-graded ladder; ~matched average bits).
taperkv:
  key_bits: 6
  value_bits: 3
  b_min: 2
  b_min_value: 2
taperkv_sweep:
  - {label: "TaperKV-asym",   key_bits: 6, value_bits: 3, b_min: 2, b_min_value: 2}
  - {label: "TaperKV-sym",    key_bits: 4, value_bits: 4, b_min: 2, b_min_value: 2}
  - {label: "TaperKV-revsym", key_bits: 3, value_bits: 6, b_min: 2, b_min_value: 2}

# --- metrics: retrieval (needle) + PPL are enough to show the lever effect ---
run_needle: true
context_lens: [4096, 8192]
depths: [0.1, 0.5, 0.9]
seeds: 3
max_new_needle: 32

run_ruler: false
run_longbench: false
run_gsm8k: false
run_math: false

run_ppl: true
ppl_max_length: 4096
ppl_stride: 2048
ppl_windows: null            # complete WikiText-2 test split
