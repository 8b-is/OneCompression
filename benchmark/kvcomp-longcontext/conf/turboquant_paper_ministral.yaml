# LEGACY PRE-FORMAL RETRIEVAL PRESET -- NOT REFRESHED PAPER EVIDENCE.
# HayateQuant-vs-TurboQuant development benchmark on the second TurboQuant model.
#
# The TurboQuant paper (arXiv:2504.19874) evaluates KV-cache quantization on TWO
# models: Llama-3.1-8B-Instruct (see turboquant_paper.yaml) and
# **Ministral-8B-Instruct-2410**.  This config runs the identical method/metric
# grid (historical HayateQuant variants + TurboQuant full bit-grids + HALO,
# KIVI/StreamingLLM/FP8/NVFP4 + TaperKV/TurboTaper) on Ministral.  It does not
# establish a win.  Current claims require the coverage-checked formal launcher
# and renderer under benchmark/kvcomp-codec/.
#
# Supply an external model path with ``model_path=...``; weights are not stored
# in this repository.
#   srun --gres=gpu:1 .../python -u kv_benchmark.py \
#       --config-name turboquant_paper_ministral
# or override the path:
#   ... --config-name turboquant_paper_ministral \
#       model_path=/lustre/.../models/Ministral-8B-Instruct-2410

defaults:
  - turboquant_paper
  - _self_

# Ministral-8B-Instruct-2410 (head_dim=128, power-of-two -> fast Hadamard rotation).
model_path: ???  # external local path or Hugging Face id

output_dir: ${hydra:runtime.cwd}/results_paper1/retrieval_minis
