# KV-cache long-context benchmark config (Hydra).
# Override on the CLI, e.g.:
#   python kv_benchmark.py model_path=/lustre/.../models/DeepSeek-R1-Distill-Qwen-7B

model_path: ???            # local model dir or HF id
device: cuda:0
dtype: bfloat16
attn_implementation: eager  # ThinKV thought-classification reads attn weights

output_dir: ${hydra:runtime.cwd}/results

# Which methods to run (empty/null = all). Names: FullKV, Uniform-INT4,
# Uniform-INT2, StreamingLLM, ThinKV (TBQ-only in HF), PM-KVQ, TaperKV.
methods: null

# --- shared cache knobs. Needle reports an accuracy-vs-realised-memory Pareto
#     frontier. `target_mem` controls StreamingLLM only; do not call two methods
#     iso-memory unless a dedicated matched operating-point run verifies it. ---
sink_tokens: 4
recent_tokens: 64
requant_stride: 16          # graded caches re-grade every N decode steps
target_mem: 0.27            # StreamingLLM stored/fp16 operating point

uniform_bits: [4, 2]        # uniform-quant baselines (per-token INT)

# TurboQuant (arXiv:2504.19874): rotation + Lloyd-Max scalar quant. Each entry
# is a codec kwargs dict; "2.5-bit"/"3.5-bit" use the paper's 32/96 outlier
# split at head_dim=128 (2.25/3.25 payload + 0.25 for two fp16 norms).
turboquant_variants: []

# FibQuant v1 exact spherical-Beta block-VQ quality baseline.  Entries are
# restricted to {label: FibQuant-paper, bits: 2|3|4}; this research path is
# intentionally excluded from decode/inference-speed comparisons.
fibquant_variants: []

# BlockQuant v1 exact-search fixed-seed quality baseline.  The only accepted
# entry is {label: BlockQuant-paper, bits: 3}; the builder additionally requires
# head_dim=128 and records/counts the versioned dynamic top-32 identity field.
# It is deliberately absent from every speed harness.
blockquant_variants: []
# KIVI baseline (arXiv:2402.02750): per-channel key, per-token value. Empty=skip.
kivi_bits: []

# HayateQuant codec variants (PROPOSED: block-VQ + folded hybrid rotation).
# Each entry is a codec kwargs dict {label, bits, ...}; empty = skip.
hayatequant_variants: []

# HALO codec variants (superseded baseline). Same format; empty = skip HALO.
halo_variants: []

# Generic codec methods: benchmark ANY registered codec by name. Each entry is
# {label, codec, **kwargs}. Makes fp8/nvfp4/ternary/int8/... reachable, e.g.:
#   - {label: FP8,     codec: fp8}
#   - {label: NVFP4,   codec: nvfp4}
#   - {label: Ternary, codec: ternary}
#   - {label: Uniform-INT8, codec: int8, key_axis: token, value_axis: token}
codec_variants: []

# TurboTaper (proposed): TaperKV age-ladder + TurboQuant rotated Lloyd-Max.
# Always built; overrides default to the taperkv section values.
turbotaper:
  dist: gaussian            # RMS-normalised rotated Lloyd-Max (real-KV default)
  rotation_mode: hadamard   # fast WHT for power-of-two head_dim
  n_outlier_floor: 0        # >0 protects N highest-energy channels at the floor (+1 bit)
  # SAFETY: Hadamard rotation + 2-bit value floor is catastrophic on Qwen-based
  # reasoning models (GSM8K/MATH drop to 0%; verified in paper_aime.yaml).
  # Override to 3 for Qwen/DeepSeek-R1-Distill-Qwen models.  Llama is safe at 2.
  b_min_value: 2            # override to 3 for Qwen reasoning models

# Skip massive-activation (outlier) layers in *every* quant method (fair, K23).
skip_outliers: true
outlier_ratio: 50.0         # key max/median ratio threshold for outlier layers

thinkv:
  group_size: 16
  precision: {R: 4, E: 4, T: 2}   # static per-thought bits (paper)
  auto_configure: true            # outlier-layer skip + L*/threshold calibration for TBQ
  calib_max_new: 200              # CoT length per calibration prompt
  capture_long: false             # attn capture on needle/local multi-key (long-context OOM risk; K25)

pmkvq:
  key_bits: 8               # high precision for recent keys (K>V, MKLV)
  value_bits: 4
  final_bits: 2             # value floor (Fbit, no eviction)
  key_final_bits: 4         # key floor (>= value floor; per-token 2-bit keys are catastrophic)
  ladder_span: 256          # progressive high->final transition (absolute)
  # Offline calibration (paper-faithful, §3.2/§3.3). Off by default (fast,
  # behaviour-faithful); enable in paper_aime.yaml for the paper comparison.
  block_allocation: false   # Taylor-sensitivity integer program (scipy.milp)
  channel_reparam: false    # positional-interpolation key reparameterization
  bit_options: [2, 4, 8]    # candidate per-block final bit-widths for the IP
  avg_bit_budget: null      # null -> use final_bits as the average budget
  pos_scale: 4              # PI position scaling (Eq. 12)

taperkv:
  key_bits: 8
  value_bits: 4
  b_min: 4                  # key floor (keys deserve more bits; needle survives)
  b_min_value: 2            # value floor

# Optional TaperKV memory sweep: extra TaperKV operating points to trace the
# accuracy-vs-memory Pareto curve (enable by selecting them in `methods`).
taperkv_sweep:
  - {label: TaperKV-aggr, key_bits: 4, value_bits: 2, b_min: 2, b_min_value: 2, recent_tokens: 32}
  - {label: TaperKV-mid,  key_bits: 6, value_bits: 3, b_min: 2, b_min_value: 2, recent_tokens: 48}

# Optional TurboTaper sweep: same {label, kwargs} pattern as taperkv_sweep, for
# Pareto curves of the rotated-codec recipe variant.
turbotaper_sweep: []

# --- deterministic synthetic needle grid ---
# `context_lens` are requested filler-token budgets. Per-example rendered prompt
# lengths, realised depths, golds/predictions, hashes, and per-trial cache
# accounting are retained in result JSON; this is not a canonical external benchmark.
context_lens: [2048, 4096, 8192]
depths: [0.1, 0.25, 0.4, 0.5, 0.6, 0.75, 0.9]
seeds: 3
sample_seed: 0              # common random numbers across compression methods
max_new_needle: 64          # raise to ~256 for long-CoT reasoning models

# --- local synthetic multi-key retrieval (not a RULER benchmark) ---
run_ruler: false            # historical config name retained for compatibility
ruler_keys: 4
ruler_seeds: 5

# --- NeMo-Skills RULER v1 adapter (13 tasks x 100 tokenizer-specific samples) ---
# Canonical NVIDIA/RULER v1 uses 500 samples/task; this protocol is named separately.
# `data_root` must directly contain <task>/test.jsonl for all selected tasks.
# Finite limits or task subsets are recorded as incomplete protocol smoke results.
# The `official_ruler_*` key names below are retained for config compatibility only.
run_official_ruler_v1: false
official_ruler_data_root: null
official_ruler_manifest_path: null  # null = data_root/../manifest.json auto-discovery
official_ruler_tasks: []     # empty = all 13 RULER v1 tasks
official_ruler_max_context: null
official_ruler_start: 0
official_ruler_limit: null   # null = complete pinned 100-sample/task adapter protocol

# --- needle toggle (disable on reasoning models where FullKV retrieval fails) ---
run_needle: true

# --- reasoning (GSM8K pass@1) ---
run_gsm8k: true
gsm8k_limit: 50             # finite value = smoke; null = complete test split
max_new_reason: 1024

# --- reasoning (MATH-500 pass@1) ---
run_math: false
math_start: 0              # global row offset for exact [0,500) shard coverage
math_limit: 50              # finite value = smoke; null = complete MATH-500
max_new_math: 1024 # Math-Verify math_500 task generation_size
math_grader: math_verify    # official full-generation extraction/equivalence
math_verify_version: "0.9.0"
math500_revision: 6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be

# --- LongBench-E end-to-end generation (TurboQuant Table 1 downstream metric) ---
run_longbench: false
longbench_tasks: []         # empty = all 13 English LongBench-E tasks
longbench_max_length: 32768 # model prompt budget; bucket uses original row length
longbench_limit: null       # null = complete official split; integer = smoke only

# --- HumanEval-shaped functional-code smoke test (NOT official LiveCodeBench) ---
# Either point lcb_problems_path at a local JSONL of {prompt, entry_point, test}
# (the reproducible offline path) or let lcb_dataset load the HF set. Generated
# code runs in a sandboxed subprocess (rlimits + timeout); use an isolated node.
run_livecodebench: false    # local smoke only; use the external official runner for paper numbers
lcb_problems_path: null     # local JSONL; null -> load lcb_dataset from HF
lcb_dataset: livecodebench/code_generation_lite
lcb_split: test
lcb_limit: 50
lcb_k: 1
lcb_timeout: 6.0            # per-sample wall-clock seconds in the sandbox
max_new_code: 4096

# --- perplexity sanity ---
run_ppl: true
ppl_max_length: 2048
ppl_stride: 1024
ppl_windows: 16             # finite value = smoke; null = complete test split

hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
