# KV-cache long-context benchmark config (Hydra).
# Override on the CLI, e.g.:
#   python kv_benchmark.py model_path=/lustre/.../models/DeepSeek-R1-Distill-Qwen-7B

model_path: ???            # local model dir or HF id
device: cuda:0
dtype: bfloat16
attn_implementation: eager  # ThinKV thought-classification reads attn weights

output_dir: ${hydra:runtime.cwd}/results

# Which methods to run (empty/null = all). Names: FullKV, Uniform-INT4,
# Uniform-INT2, StreamingLLM, ThinKV, PM-KVQ, TaperKV.
methods: null

# --- shared budget knobs (kept identical across methods for a fair iso-memory
#     comparison; sink+recent define the high-precision window everywhere) ---
sink_tokens: 4
recent_tokens: 64
requant_stride: 16          # graded caches re-grade every N decode steps
target_mem: 0.27            # iso-memory budget (stored/fp16) for the evict window

uniform_bits: [4, 2]        # uniform-quant baselines (per-token INT)

# TurboQuant (arXiv:2504.19874): rotation + Lloyd-Max scalar quant. Each entry
# is a codec kwargs dict; "2.5-bit"/"3.5-bit" use the paper's outlier split
# (32 ch @ +1 bit, 96 ch @ base; head_dim=128). Empty = skip TurboQuant.
turboquant_variants: []
# KIVI baseline (arXiv:2402.02750): per-channel key, per-token value. Empty=skip.
kivi_bits: []

# HALO codec variants (fast rotated Lloyd-Max). Each entry is a codec kwargs
# dict {label, bits, ...}; empty = skip HALO.
halo_variants: []

# Generic codec methods: benchmark ANY registered codec by name. Each entry is
# {label, codec, **kwargs}. Makes fp8/nvfp4/ternary/int8/... reachable, e.g.:
#   - {label: FP8,     codec: fp8}
#   - {label: NVFP4,   codec: nvfp4}
#   - {label: Ternary, codec: ternary}
#   - {label: Uniform-INT8, codec: int8, key_axis: token, value_axis: token}
codec_variants: []

# TurboTaper (proposed): TaperKV age-ladder + TurboQuant rotated Lloyd-Max.
# Always built; overrides default to the taperkv section values.
turbotaper:
  dist: gaussian            # RMS-normalised rotated Lloyd-Max (real-KV default)
  rotation_mode: hadamard   # fast WHT for power-of-two head_dim
  n_outlier_floor: 0        # >0 protects N highest-energy channels at the floor (+1 bit)
  # SAFETY: Hadamard rotation + 2-bit value floor is catastrophic on Qwen-based
  # reasoning models (GSM8K/MATH drop to 0%; verified in paper_aime.yaml).
  # Override to 3 for Qwen/DeepSeek-R1-Distill-Qwen models.  Llama is safe at 2.
  b_min_value: 2            # override to 3 for Qwen reasoning models

# Skip massive-activation (outlier) layers in *every* quant method (fair, K23).
skip_outliers: true
outlier_ratio: 50.0         # key max/median ratio threshold for outlier layers

thinkv:
  group_size: 16
  precision: {R: 4, E: 4, T: 2}   # static per-thought bits (paper)
  auto_configure: true            # outlier-layer skip + L*/threshold calibration (faithful 08 setup)
  calib_max_new: 200              # CoT length per calibration prompt
  capture_long: false             # attn capture on needle/RULER (output_attentions OOMs at long ctx; K25)

pmkvq:
  key_bits: 8               # high precision for recent keys (K>V, MKLV)
  value_bits: 4
  final_bits: 2             # value floor (Fbit, no eviction)
  key_final_bits: 4         # key floor (>= value floor; per-token 2-bit keys are catastrophic)
  ladder_span: 256          # progressive high->final transition (absolute)
  # Offline calibration (paper-faithful, §3.2/§3.3). Off by default (fast,
  # behaviour-faithful); enable in paper_aime.yaml for the paper comparison.
  block_allocation: false   # Taylor-sensitivity integer program (scipy.milp)
  channel_reparam: false    # positional-interpolation key reparameterization
  bit_options: [2, 4, 8]    # candidate per-block final bit-widths for the IP
  avg_bit_budget: null      # null -> use final_bits as the average budget
  pos_scale: 4              # PI position scaling (Eq. 12)

taperkv:
  key_bits: 8
  value_bits: 4
  b_min: 4                  # key floor (keys deserve more bits; needle survives)
  b_min_value: 2            # value floor

# Optional TaperKV memory sweep: extra TaperKV operating points to trace the
# accuracy-vs-memory Pareto curve (enable by selecting them in `methods`).
taperkv_sweep:
  - {label: TaperKV-aggr, key_bits: 4, value_bits: 2, b_min: 2, b_min_value: 2, recent_tokens: 32}
  - {label: TaperKV-mid,  key_bits: 6, value_bits: 3, b_min: 2, b_min_value: 2, recent_tokens: 48}

# Optional TurboTaper sweep: same {label, kwargs} pattern as taperkv_sweep, for
# Pareto curves of the rotated-codec recipe variant.
turbotaper_sweep: []

# --- needle-in-a-haystack grid ---
context_lens: [2048, 4096, 8192]
depths: [0.1, 0.25, 0.4, 0.5, 0.6, 0.75, 0.9]
seeds: 3
max_new_needle: 64          # raise to ~256 for long-CoT reasoning models

# --- RULER multi-key retrieval (harder: disambiguate among distractor keys) ---
run_ruler: false            # enable for the retrieval-stress comparison
ruler_keys: 4
ruler_seeds: 5

# --- needle toggle (disable on reasoning models where FullKV retrieval fails) ---
run_needle: true

# --- reasoning (GSM8K pass@1) ---
run_gsm8k: true
gsm8k_limit: 50
max_new_reason: 1024

# --- reasoning (MATH-500 pass@1) ---
run_math: false
math_limit: 50
max_new_math: 3072

# --- LongBench-E end-to-end generation (TurboQuant Table 1 downstream metric) ---
run_longbench: false
longbench_tasks: []         # empty = all 13 English LongBench-E tasks
longbench_max_length: 7500  # prompt budget; longer prompts middle-truncated
longbench_limit: 20         # samples per task

# --- LiveCodeBench functional pass@1 (ThinKV code axis) ---
# Either point lcb_problems_path at a local JSONL of {prompt, entry_point, test}
# (the reproducible offline path) or let lcb_dataset load the HF set. Generated
# code runs in a sandboxed subprocess (rlimits + timeout); use an isolated node.
run_livecodebench: false
lcb_problems_path: null     # local JSONL; null -> load lcb_dataset from HF
lcb_dataset: livecodebench/code_generation_lite
lcb_split: test
lcb_limit: 50
lcb_k: 1
lcb_timeout: 6.0            # per-sample wall-clock seconds in the sandbox
max_new_code: 4096

# --- perplexity sanity ---
run_ppl: true
ppl_max_length: 2048
ppl_stride: 1024
ppl_windows: 16

hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
